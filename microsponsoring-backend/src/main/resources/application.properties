# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/microsponsoring_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.packagesToScan=com.example.microsponsoringbackend.model
spring.jpa.properties.hibernate.hbm2ddl.auto=update
spring.jpa.properties.hibernate.hbm2ddl.create=false
spring.jpa.properties.hibernate.hbm2ddl.drop=false

# Liquibase Configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Server Configuration
server.port=8080

# JWT Configuration
jwt.secret=${JWT_SECRET:your-secret-key-here-change-in-production}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Checkout/Stripe Configuration
checkout.secret.key=${CHECKOUT_SECRET_KEY:sk_test_your_stripe_secret_key_here}
checkout.public.key=${CHECKOUT_PUBLIC_KEY:pk_test_your_stripe_public_key_here}

# File Upload Configuration
file.upload-dir=./uploads

# Password Reset Configuration
password.reset.token.expiration=3600000

# Email Configuration (Gmail SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:bousnina.baha14@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your_app_password_here}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true

# Logging Configuration
logging.level.com.example.microsponsoringbackend=DEBUG
logging.level.org.springframework.security=DEBUG


# Image serving configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# File upload directory
file.upload-dir=/app/images

# CORS configuration
cors.allowed-origins=http://microsponsoring.local:32403,http://localhost:32403
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# Security configuration for public endpoints
security.public-endpoints=/actuator/health,/actuator/info,/images/**,/ws-notifications/**

