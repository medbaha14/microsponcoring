apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: microsponsoring
  labels:
    app: backend
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        version: v1
    spec:
      hostNetwork: true
      containers:
      - name: backend
        image: medbaha/pfebackend:latest
        ports:
        - containerPort: 8080
        env:
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: db-url
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: db-username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: db-password
        - name: CHECKOUT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: checkout-secret-key
        - name: CHECKOUT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: checkout-public-key
        - name: MAIL_HOST
          value: "smtp.gmail.com"
        - name: MAIL_PORT
          value: "587"
        - name: MAIL_USERNAME
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: mail-username
        - name: MAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: mail-password
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        volumeMounts:
        - mountPath: /app/images
          name: images-storage
        - mountPath: /app/invoices
          name: invoices-storage
      volumes:
      - name: images-storage
        persistentVolumeClaim:
          claimName: images-pvc
      - name: invoices-storage
        persistentVolumeClaim:
          claimName: invoices-pvc
