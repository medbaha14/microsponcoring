# LoadBalancer-only services (no Ingress needed)
apiVersion: v1
kind: Service
metadata:
  name: frontend-loadbalancer
  namespace: microsponsoring
  labels:
    app: frontend
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
---
apiVersion: v1
kind: Service
metadata:
  name: backend-loadbalancer
  namespace: microsponsoring
  labels:
    app: backend
  annotations:
    # WebSocket optimizations
    service.beta.kubernetes.io/aws-load-balancer-connection-draining-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-connection-draining-timeout: "60"
    service.beta.kubernetes.io/aws-load-balancer-connection-idle-timeout: "3600"
spec:
  type: LoadBalancer
  selector:
    app: backend
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: api
  - port: 8081
    targetPort: 8081
    protocol: TCP
    name: websocket
  # Enable session affinity for WebSocket connections
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
---
apiVersion: v1
kind: Service
metadata:
  name: image-loadbalancer
  namespace: microsponsoring
  labels:
    app: image-service
spec:
  type: LoadBalancer
  selector:
    app: image-service
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
---
# Keep internal ClusterIP services for inter-service communication
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: microsponsoring
spec:
  selector:
    app: backend
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  - port: 8081
    targetPort: 8081
    protocol: TCP
    name: websocket
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: microsponsoring
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: image-service
  namespace: microsponsoring
spec:
  selector:
    app: image-service
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  type: ClusterIP
