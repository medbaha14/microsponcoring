apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: microsponsoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: medbaha/pfebackend:latest
        ports:
        - containerPort: 8080
        env:
        # Database Configuration - Connect to correct MySQL service
        - name: DB_URL
          value: "jdbc:mysql://mysql:3306/microsponsoring_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
        - name: DB_USERNAME
          value: "root"
        - name: DB_PASSWORD
          value: ""
        - name: CHECKOUT_SECRET_KEY
          value: "sk_sbox_iithuw4ge2ahksjxeybyp237wyx"
        - name: CHECKOUT_PUBLIC_KEY
          value: "pk_sbox_ilziuiwrfcgbwokgwskduowqemh"
        - name: SERVER_PORT
          value: "8080"
        - name: MAIL_HOST
          value: "smtp.gmail.com"
        - name: MAIL_PORT
          value: "587"
        - name: MAIL_USERNAME
          value: "bousnina.baha14@gmail.com"
        - name: MAIL_PASSWORD
          value: "wasv wstd eibu urzo"
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 10
