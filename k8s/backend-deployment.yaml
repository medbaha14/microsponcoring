apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: microsponsoring
  labels:
    app: backend
    version: v1
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
      - name: backend
        image: medbaha/microsponsoring-backend:latest  
        ports:
        - containerPort: 8080
        env:
        # Database Configuration - Now points to MySQL service in Kubernetes
        - name: DB_URL
          value: "jdbc:mysql://mysql:3306/microsponsoring_db?useSSL=false&serverTimezone=UTC"
        - name: DB_USERNAME
          value: "root"
        - name: DB_PASSWORD
          value: ""  # Empty password as in your env
        
        # Checkout Configuration
        - name: CHECKOUT_SECRET_KEY
          value: "sk_sbox_iithuw4ge2ahksjxeybyp237wyx"
        - name: CHECKOUT_PUBLIC_KEY
          value: "pk_sbox_ilziuiwrfcgbwokgwskduowqemh"
        
        # Server Configuration
        - name: SERVER_PORT
          value: "8080"
        
        # Email Configuration (exactly as in your env)
        - name: MAIL_HOST
          value: "smtp.gmail.com"
        - name: MAIL_PORT
          value: "587"
        - name: MAIL_USERNAME
          value: "bousnina.baha14@gmail.com"
        - name: MAIL_PASSWORD
          value: "wasv wstd eibu urzo"  # With spaces as in your env
        
        # Spring Profile
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 90  # Increased to wait for DB
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60  # Increased to wait for DB
          periodSeconds: 10
          timeoutSeconds: 3
        volumeMounts:
        - name: images-storage
          mountPath: /app/images
        - name: invoices-storage
          mountPath: /app/invoices
      volumes:
      - name: images-storage
        persistentVolumeClaim:
          claimName: images-pvc
      - name: invoices-storage
        persistentVolumeClaim:
          claimName: invoices-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: microsponsoring
spec:
  selector:
    app: backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: images-pvc
  namespace: microsponsoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: invoices-pvc
  namespace: microsponsoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi