apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: microsponsoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      nodeSelector:
        kubernetes.io/hostname: "workernode1-vmware-virtual-platform"
      containers:
      - name: backend
        image: medbaha/pfebackend:latest
        ports:
        - containerPort: 8080
        env:
        - name: DB_URL
          value: "jdbc:mysql://mysql-service:3306/microsponsoring_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
        - name: DB_USERNAME
          value: "microsponsoring_user"
        - name: DB_PASSWORD
          value: ""
        - name: JWT_SECRET
          value: "your-secret-key-here-change-in-production"
        - name: JWT_EXPIRATION
          value: "86400000"
        - name: FILE_UPLOAD_DIR
          value: "/app/images"
        - name: MAIL_USERNAME
          value: "your-email@example.com"
        - name: MAIL_PASSWORD
          value: "your-email-password"
        - name: CHECKOUT_SECRET_KEY
          value: "your-checkout-secret-key"
        - name: CHECKOUT_PUBLIC_KEY
          value: "your-checkout-public-key"
        volumeMounts:
        - name: images-storage
          mountPath: /app/images
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: images-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: microsponsoring
spec:
  selector:
    app: backend
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP
