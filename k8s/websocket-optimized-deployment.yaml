# Optimized backend deployment for WebSocket with LoadBalancer
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: microsponsoring
  labels:
    app: backend
spec:
  replicas: 2  # Multiple replicas for WebSocket load balancing
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      nodeSelector:
        kubernetes.io/hostname: "workernode1-vmware-virtual-platform"
      containers:
      - name: backend
        image: medbaha/pfebackend:latest
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8081
          name: websocket
        env:
        - name: DB_URL
          value: "jdbc:mysql://mysql-service:3306/microsponsoring_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
        - name: DB_USERNAME
          value: "root"
        - name: DB_PASSWORD
          value: "rootpassword"
        - name: JWT_SECRET
          value: "microsponsoring-jwt-secret-key-2024-production-ready"
        - name: JWT_EXPIRATION
          value: "86400000"
        - name: FILE_UPLOAD_DIR
          value: "/app/images"
        - name: MAIL_USERNAME
          value: "bousnina.baha14@gmail.com"
        - name: MAIL_PASSWORD
          value: "wasv wstd eibu urzo"
        - name: CHECKOUT_SECRET_KEY
          value: "sk_sbox_iithuw4ge2ahksjxeybyp237wyx"
        - name: CHECKOUT_PUBLIC_KEY
          value: "pk_sbox_ilziuiwrfcgbwokgwskduowqemh"
        - name: SPRING_SECURITY_CSRF_ENABLED
          value: "false"
        - name: SECURITY_PUBLIC_ENDPOINTS
          value: "/actuator/health,/actuator/info,/images/**,/uploads/**,/ws-notifications/**,/api/auth/**"
        - name: SPRING_WEB_CORS_ALLOWED_ORIGINS
          value: "*"  # Allow all origins for WebSocket
        - name: SPRING_WEB_CORS_ALLOWED_METHODS
          value: "GET,POST,PUT,DELETE,OPTIONS"
        - name: SPRING_WEB_CORS_ALLOWED_HEADERS
          value: "*"
        - name: SPRING_WEB_CORS_ALLOW_CREDENTIALS
          value: "true"
        - name: WEBSOCKET_PORT
          value: "8081"
        - name: WEBSOCKET_ALLOWED_ORIGINS
          value: "*"
        # WebSocket-specific optimizations
        - name: SPRING_WEBSOCKET_SOCKJS_ALLOWED_ORIGINS
          value: "*"
        - name: SPRING_WEBSOCKET_STOMP_RELAY_HOST
          value: "localhost"
        - name: SPRING_WEBSOCKET_STOMP_RELAY_PORT
          value: "61613"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: images-storage
          mountPath: /app/images
        - name: static-storage
          mountPath: /app/static/uploads
      volumes:
      - name: images-storage
        emptyDir: {}
      - name: static-storage
        emptyDir: {}
---
# LoadBalancer service for WebSocket
apiVersion: v1
kind: Service
metadata:
  name: websocket-loadbalancer
  namespace: microsponsoring
  labels:
    app: backend
  annotations:
    # WebSocket optimizations
    service.beta.kubernetes.io/aws-load-balancer-connection-draining-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-connection-draining-timeout: "60"
    service.beta.kubernetes.io/aws-load-balancer-connection-idle-timeout: "3600"
spec:
  type: LoadBalancer
  selector:
    app: backend
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  - port: 8081
    targetPort: 8081
    protocol: TCP
    name: websocket
  # Enable session affinity for WebSocket connections
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
---
# Regular ClusterIP service for internal communication
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: microsponsoring
spec:
  selector:
    app: backend
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  - port: 8081
    targetPort: 8081
    protocol: TCP
    name: websocket
  type: ClusterIP
