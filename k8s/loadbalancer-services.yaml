# LoadBalancer services for microsponsoring application
apiVersion: v1
kind: Service
metadata:
  name: frontend-loadbalancer
  namespace: microsponsoring
  labels:
    app: frontend
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  - port: 443
    targetPort: 443
    protocol: TCP
    name: https
---
apiVersion: v1
kind: Service
metadata:
  name: backend-loadbalancer
  namespace: microsponsoring
  labels:
    app: backend
spec:
  type: LoadBalancer
  selector:
    app: backend
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: api
  - port: 8081
    targetPort: 8081
    protocol: TCP
    name: websocket
---
apiVersion: v1
kind: Service
metadata:
  name: image-loadbalancer
  namespace: microsponsoring
  labels:
    app: image-service
spec:
  type: LoadBalancer
  selector:
    app: image-service
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
