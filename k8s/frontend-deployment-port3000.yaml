apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: microsponsoring
  labels:
    app: frontend
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        version: v1
    spec:
      hostNetwork: true
      containers:
      - name: frontend
        image: medbaha/pfefrontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: REACT_APP_API_URL
          value: "http://192.168.179.128:8080"
        - name: PORT
          value: "3000"
        command: ["/bin/sh"]
        args: ["-c", "sed -i 's/listen 80;/listen 3000;/g' /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"]
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
