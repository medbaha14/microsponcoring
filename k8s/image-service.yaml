apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-service
  namespace: microsponsoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-service
  template:
    metadata:
      labels:
        app: image-service
    spec:
      nodeSelector:
        kubernetes.io/hostname: "workernode1-vmware-virtual-platform"
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: images-storage
          mountPath: /usr/share/nginx/html/images
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
      volumes:
      - name: images-storage
        emptyDir: {}
      - name: nginx-config
        configMap:
          name: nginx-image-config
---
apiVersion: v1
kind: Service
metadata:
  name: image-service
  namespace: microsponsoring
spec:
  selector:
    app: image-service
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-image-config
  namespace: microsponsoring
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;
        
        location /images/ {
            alias /usr/share/nginx/html/images/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "*";
        }
    }
