
cat <<'EOF' > microsponsoring-app.yaml
---
# =============================================================================
# MICROSPONSORING APPLICATION - MAIN CONFIGURATION
# =============================================================================
# This file contains all the configuration for your microsponsoring application.
# Update the values below and run: kubectl apply -f microsponsoring-app.yaml
# =============================================================================

# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: microsponsoring
---
# MySQL Database Configuration
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: microsponsoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0  # UPDATE: Change MySQL version here
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "root123"  # UPDATE: Change root password
        - name: MYSQL_DATABASE
          value: "microsponsoring"  # UPDATE: Change database name
        - name: MYSQL_USER
          value: "microsponsoring"  # UPDATE: Change database user
        - name: MYSQL_PASSWORD
          value: "microsponsoring123"  # UPDATE: Change database password
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
      volumes:
      - name: mysql-data
        emptyDir: {}  # UPDATE: Change to PersistentVolumeClaim for production
---
# MySQL Service
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: microsponsoring
spec:
  type: ClusterIP
  selector:
    app: mysql
  ports:
  - name: mysql
    port: 3306
    targetPort: 3306
---
# Backend Application Configuration
apiVersion: apps/v1
kind: Deployment
metadata:
  name: microsponsoring-backend
  namespace: microsponsoring
spec:
  replicas: 2  # UPDATE: Change number of backend replicas
  selector:
    matchLabels:
      app: microsponsoring-backend
  template:
    metadata:
      labels:
        app: microsponsoring-backend
    spec:
      containers:
      - name: backend
        image: medbaha/pfebackend:7fd06a5cd7cffda3b73a5e1229ff9f2082f78995  # UPDATE: Change backend image/tag
        ports:
        - containerPort: 8080
        env:
        # Database Configuration
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://mysql:3306/microsponsoring?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
        - name: SPRING_DATASOURCE_USERNAME
          value: "microsponsoring"  # UPDATE: Must match MYSQL_USER above
        - name: SPRING_DATASOURCE_PASSWORD
          value: "microsponsoring123"  # UPDATE: Must match MYSQL_PASSWORD above
        
        # JPA Configuration
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: "update"  # UPDATE: Change to "validate" for production
        - name: SPRING_LIQUIBASE_ENABLED
          value: "false"  # UPDATE: Change to "true" if using Liquibase
        
        # Email Configuration
        - name: SPRING_MAIL_ENABLED
          value: "true"  # UPDATE: Change to "false" to disable email
        - name: SPRING_MAIL_HOST
          value: "smtp.gmail.com"  # UPDATE: Change SMTP server
        - name: SPRING_MAIL_PORT
          value: "587"  # UPDATE: Change SMTP port
        - name: SPRING_MAIL_USERNAME
          value: "bousnina.baha14@gmail.com"  # UPDATE: Change email username
        - name: SPRING_MAIL_PASSWORD
          value: "wasv wstd eibu urzo"  # UPDATE: Change email password
        - name: SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH
          value: "true"
        - name: SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE
          value: "true"
        - name: SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT
          value: "5000"
        - name: SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT
          value: "5000"
        - name: SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT
          value: "5000"
        
        # File Upload Configuration
        - name: FILE_UPLOAD_DIR
          value: "/tmp/uploads"  # UPDATE: Change upload directory
        
        # Payment Configuration
        - name: CHECKOUT_SECRET_KEY
          value: "sk_sbox_iithuw4ge2ahksjxeybyp237wyx"  # UPDATE: Change to production key
        - name: CHECKOUT_PUBLIC_KEY
          value: "pk_sbox_ilziuiwrfcgbwokgwskduowqemh"  # UPDATE: Change to production key
        
        # JWT Configuration
        - name: JWT_SECRET
          value: "placeholder-jwt-secret-456"  # UPDATE: Change to secure secret
        
        # Stripe Configuration
        - name: STRIPE_SECRET_KEY
          value: "placeholder-stripe-secret-key"  # UPDATE: Change to production key
        - name: STRIPE_PUBLISHABLE_KEY
          value: "placeholder-stripe-publishable-key"  # UPDATE: Change to production key
        
        # Server Configuration
        - name: SERVER_PORT
          value: "8080"
        - name: SPRING_PROFILES_ACTIVE
          value: "default"  # UPDATE: Change to "prod" for production
        
        resources:
          requests:
            cpu: "500m"  # UPDATE: Change CPU requests
            memory: "512Mi"  # UPDATE: Change memory requests
          limits:
            cpu: "1"  # UPDATE: Change CPU limits
            memory: "1Gi"  # UPDATE: Change memory limits
---
# Backend Service
apiVersion: v1
kind: Service
metadata:
  name: microsponsoring-backend
  namespace: microsponsoring
spec:
  type: ClusterIP  # UPDATE: Change to LoadBalancer for external access
  selector:
    app: microsponsoring-backend
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
# Nginx Configuration for Frontend
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: microsponsoring
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log;
    pid /tmp/nginx.pid;
    
    events {
      worker_connections 1024;  # UPDATE: Change worker connections
    }
    
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      
      # Upstream backend
      upstream backend {
        server microsponsoring-backend:8080;  # UPDATE: Change backend service
      }
      
      server {
        listen 8080;  # UPDATE: Change frontend port
        server_name localhost;  # UPDATE: Change server name
        
        root /usr/share/nginx/html;
        index index.html;
        
        # Route API calls to backend
        location /api/ {
          proxy_pass http://backend;
          proxy_set_header Host \$host;
          proxy_set_header X-Real-IP \$remote_addr;
          proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto \$scheme;
        }
        
        # Handle static files with proper MIME types
        location ~* \.css$ {
          add_header Content-Type "text/css; charset=utf-8";
          try_files \$uri =404;
        }
        
        location ~* \.js$ {
          add_header Content-Type "application/javascript; charset=utf-8";
          try_files \$uri =404;
        }
        
        # Default location for Angular routing
        location / {
          try_files \$uri \$uri/ /index.html;
        }
      }
    }
---
# Frontend Application Configuration
apiVersion: apps/v1
kind: Deployment
metadata:
  name: microsponsoring-frontend
  namespace: microsponsoring
spec:
  replicas: 2  # UPDATE: Change number of frontend replicas
  selector:
    matchLabels:
      app: microsponsoring-frontend
  template:
    metadata:
      labels:
        app: microsponsoring-frontend
    spec:
      containers:
      - name: frontend
        image: medbaha/pfefrontend:7fd06a5cd7cffda3b73a5e1229ff9f2082f78995  # UPDATE: Change frontend image/tag
        ports:
        - containerPort: 8080  # UPDATE: Must match nginx listen port
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        command: ["nginx"]
        args: ["-g", "daemon off;"]
        resources:
          requests:
            cpu: "100m"  # UPDATE: Change CPU requests
            memory: "128Mi"  # UPDATE: Change memory requests
          limits:
            cpu: "200m"  # UPDATE: Change CPU limits
            memory: "256Mi"  # UPDATE: Change memory limits
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
---
# Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: microsponsoring-frontend
  namespace: microsponsoring
spec:
  type: ClusterIP  # UPDATE: Change to LoadBalancer for external access
  selector:
    app: microsponsoring-frontend
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
# Ingress Configuration (Optional)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microsponsoring-ingress
  namespace: microsponsoring
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    # UPDATE: Add more annotations as needed
spec:
  rules:
  - host: microsponsoring.local  # UPDATE: Change to your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: microsponsoring-frontend
            port:
              number: 8080
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: microsponsoring-backend
            port:
              number: 8080
EOF
