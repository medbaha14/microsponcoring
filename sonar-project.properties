# SonarCloud Configuration
sonar.projectKey=medbaha14_microsponcoring
sonar.organization=medbaha14

# Project Information
sonar.projectName=Microsponsoring Platform
sonar.projectVersion=1.0.0

# Source Code
sonar.sources=microsponsoring-backend/src/main/java
sonar.java.binaries=microsponsoring-backend/target/classes
sonar.java.libraries=**/target/dependency/*.jar

# Exclusions
sonar.exclusions=**/target/**,**/node_modules/**,**/dist/**,**/*.min.js,**/*.min.css
sonar.coverage.exclusions=**/target/**,**/node_modules/**,**/dist/**,**/*Test.java,**/*Tests.java

# Test Configuration
sonar.tests=microsponsoring-backend/src/test/java
sonar.java.test.binaries=microsponsoring-backend/target/test-classes

# Coverage Reports
sonar.coverage.jacoco.xmlReportPaths=microsponsoring-backend/target/site/jacoco/jacoco.xml

# Additional Properties
sonar.java.source=21
sonar.java.target=21
sonar.sourceEncoding=UTF-8

# Quality Gate
sonar.qualitygate.wait=true
